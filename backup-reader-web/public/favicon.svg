<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Backup Reader">
  <!--
    Marca de Backup Reader para el favicon.

    Es el mismo check-circle del encabezado (components/ui/BrandChrome.tsx),
    pero RELLENO en vez de solo contorno. El del encabezado tiene un trazo de
    1.75 sobre un lienzo de 24: a 16 px, que es como lo pinta la pestaña, ese
    contorno queda en menos de un píxel y se convierte en una mancha gris.
    Relleno se sigue reconociendo al tamaño que de verdad se usa.

    El color es var(--brass-500) resuelto a mano: una variable CSS no significa
    nada fuera de la página, y un favicon lo carga el navegador suelto.
  -->
  <circle cx="32" cy="32" r="30" fill="#2F7E6C"/>
  <path d="M21.3 32.8l6.9 6.9L42.7 25.3"
        fill="none" stroke="#FFFFFF" stroke-width="6.5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
